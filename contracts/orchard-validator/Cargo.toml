[package]
name = "orchard-validator"
version = "0.1.0"
edition.workspace = true
publish.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[dependencies]
near-sdk.workspace = true
orchard = { version = "0.11.0", default-features = false }
zcash_address = { version = "0.9.0" }
zcash_primitives = { version = "0.24.0", default-features = false, features = ["transparent-inputs"] }
zcash_protocol = { version = "0.6.1" }
borsh = "1.0"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.12", features = ["custom"] }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
