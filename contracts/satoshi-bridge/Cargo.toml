[package]
name = "satoshi-bridge"
version = "0.5.0"
edition.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.16.0-rust-1.86.0"
image_digest = "sha256:3220302ebb7036c1942e772810f21edd9381edf9a339983da43487c77fbad488"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--no-abi",
]

[dependencies]
near-sdk.workspace = true
near-contract-standards.workspace = true
bitcoin.workspace = true
hex.workspace = true
near-plugins.workspace = true
k256 = "0.13.1"
ed25519-dalek = "2.1.0"
crypto-shared = { git = "https://github.com/near/mpc_old", rev = "0afee9004a1b1c3386940e60c28cff7cf1b5978c" }
zcash_primitives = { git = "https://github.com/zcash/librustzcash", rev = "a1c9aa12892a7c7e86365aa89990a584a634f53c", default-features = false }
core2 = "0.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.12", features = ["custom"] }

[dev-dependencies]
near-workspaces = { version = "0.20", features = ["unstable"] }
tokio = { version = "1.12.0", features = ["full"] }

[features]
default = ["zcash"]
zcash = []
