[package]
name = "satoshi-bridge"
version = "0.9.4"
edition.workspace = true
publish.workspace = true
repository.workspace = true

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.near.reproducible_build]
image = "sourcescan/cargo-near:0.21.1-rust-1.96.0"
image_digest = "sha256:ccb22bb4e677ed022d8b9d1aa1b32f0af52dd0471ef1c32e48dedbf68ee6ee17"
passed_env = []
container_build_command = [
    "cargo",
    "near",
    "build",
    "non-reproducible-wasm",
    "--locked",
    "--no-abi",
]

[package.metadata.near.reproducible_build.variant.bitcoin]
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi", "--no-default-features", "--features", "bitcoin"]

[package.metadata.near.reproducible_build.variant.zcash]
container_build_command = ["cargo", "near", "build", "non-reproducible-wasm", "--locked", "--no-abi", "--no-default-features", "--features", "zcash"]

[dependencies]
near-sdk.workspace = true
near-contract-standards.workspace = true
bitcoin.workspace = true
hex.workspace = true
near-plugins.workspace = true
omni-utils.workspace = true
k256 = "0.13.1"
sha3.workspace = true
ed25519-dalek = "2.1.0"
crypto-shared = { git = "https://github.com/near/mpc_old", rev = "0afee9004a1b1c3386940e60c28cff7cf1b5978c" }
zcash_primitives = { version = "=0.29.0", default-features = false, features = ["circuits", "transparent-inputs"], optional = true }
zcash_transparent = { version = "=0.9.0", features = ["transparent-inputs"], optional = true }
orchard = { version = "=0.15.0", default-features = false, optional = true }
sapling-crypto = { version = "0.7.0", default-features = false, optional = true }
zcash_script = { version = "0.4.5", optional = true }
zcash_protocol = { version = "=0.10.0" }
zcash_address = { version = "=0.13.0" }

[target.'cfg(target_arch = "wasm32")'.dependencies]
getrandom = { version = "0.2.12", features = ["custom"] }

[dev-dependencies]
near-workspaces = { version = "0.22", features = ["unstable"] }
tokio = { version = "1.12.0", features = ["full"] }
rand = "0.8"
hex = "0.4"
bs58 = "0.5"
near-account-id-v1 = { package = "near-account-id", version = "1" }

[features]
default = []
zcash = ["zcash_primitives", "zcash_transparent", "orchard", "sapling-crypto", "zcash_script"]
bitcoin = []
