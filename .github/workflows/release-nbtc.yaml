on:
  push:
    tags:
      - 'nbtc-v[0-9]+.[0-9]+.[0-9]+*'

name: Release nBTC

permissions: {}

jobs:
  build:
    runs-on: ubuntu-latest
    name: Build nBTC
    permissions:
      contents: read
    steps:
      - name: Clone the repository
        uses: actions/checkout@a37ce9120846195fa4ece8f58b268e6043cb2f26 # v3.7.0
        with:
          persist-credentials: false

      - name: Install cargo-near
        env:
          CARGO_NEAR_VERSION: cargo-near-v0.22.0
          CARGO_NEAR_SHA256: 9429064e30a427e96523f539cb255f3688d2345e5000d7d4e4873a8247247d1a
        run: |
          curl --proto '=https' --tlsv1.2 -LsSfO "https://github.com/near/cargo-near/releases/download/${CARGO_NEAR_VERSION}/cargo-near-x86_64-unknown-linux-gnu.tar.gz"
          echo "${CARGO_NEAR_SHA256}  cargo-near-x86_64-unknown-linux-gnu.tar.gz" | sha256sum -c -
          tar -xzf cargo-near-x86_64-unknown-linux-gnu.tar.gz
          install -m 755 cargo-near-x86_64-unknown-linux-gnu/cargo-near ~/.cargo/bin/

      - name: Build nBTC contract
        run: |
          make release-nbtc
        timeout-minutes: 60

      - name: Compute checksums
        run: cd res && sha256sum nbtc_release.wasm > checksums.sha256

      - name: Upload WASM
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: nbtc-wasm
          path: |
            res/nbtc_release.wasm
            res/checksums.sha256
          if-no-files-found: error

  release:
    needs: build
    runs-on: ubuntu-latest
    name: Release nBTC
    permissions:
      contents: write
    steps:
      - name: Download WASM
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: nbtc-wasm

      - name: Create Release
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2.6.2
        with:
          tag_name: ${{ github.ref_name }}
          files: |
            nbtc_release.wasm
            checksums.sha256
