name: CI

on:
  push:
    branches:
      - omni-main
  pull_request:

permissions:
  checks: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  lint:
    runs-on: warp-ubuntu-latest-x64-2x
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy

      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-provider: warpbuild
          key: lint

      - name: Run lint
        run: make lint

  test:
    strategy:
      fail-fast: false
      matrix:
        feature: [bitcoin, zcash]
    runs-on: warp-ubuntu-latest-x64-4x
    steps:
      - uses: actions/checkout@v5

      - name: Install system dependencies
        run: sudo apt-get update && sudo apt-get install -y libudev-dev

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      # Per-leg key: the features compile disjoint dep trees, so one shared
      # key means each leg evicts the other.
      - name: Setup Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          cache-provider: warpbuild
          key: test-${{ matrix.feature }}

      - name: Install cargo-near
        run: |
          curl --proto '=https' --tlsv1.2 -LsSf https://github.com/near/cargo-near/releases/latest/download/cargo-near-installer.sh | sh

      - name: Install cargo-nextest
        uses: taiki-e/install-action@nextest

      - name: Run ${{ matrix.feature }} tests
        run: make test-ci-${{ matrix.feature }}
