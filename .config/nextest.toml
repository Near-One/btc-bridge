[profile.ci]
# Each test spawns a neard sandbox: ~520MB RSS but ~0.3 of a core, so
# concurrency is bound by RAM. 16 is ~8.4GB on the 16GB runner.
test-threads = 16

fail-fast = false
failure-output = "immediate-final"

# Slowest test is ~27s, so 60s means stuck and 6min means hung.
slow-timeout = { period = "60s", terminate-after = 6 }
