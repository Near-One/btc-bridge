[profile.ci]
# Each test spawns a neard sandbox: ~520MB RSS but ~0.3 of a core. 24 was
# tried and failed: 12 zcash tests died with SandboxStartupRetriesExhausted
# and the leak count tripled, so startup contention -- not thread count --
# is the ceiling here.
test-threads = 8

fail-fast = false
failure-output = "immediate-final"

# Slowest test is ~27s, so 60s means stuck and 6min means hung.
slow-timeout = { period = "60s", terminate-after = 6 }
