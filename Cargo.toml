[workspace]
resolver = "2"
members = [
  "contracts/*"
]

[workspace.package]
edition = "2021"
publish = false
repository = "https://github.com/Near-One/btc-bridge"

[workspace.dependencies]
near-sdk = { version = "5.14.0", features = ["unstable", "unit-testing"] }
near-contract-standards = "5.14.0"
hex="0.4.3"
bitcoin = { version = "0.32.0", default-features = false, features = ["serde"] }
near-plugins = { git = "https://github.com/aurora-is-near/near-plugins", tag = "v0.4.1" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true