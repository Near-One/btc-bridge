[workspace]
resolver = "2"
members = [
  "contracts/*"
]

[workspace.package]
edition = "2021"
publish = false
repository = "https://github.com/Near-One/btc-bridge"

[workspace.dependencies]
near-sdk = { version = "5.26.1", features = ["unstable", "unit-testing"] }
near-contract-standards = "5.26.1"
hex="0.4.3"
sha3 = "0.10"
bitcoin = { version = "0.32.0", default-features = false, features = ["serde"] }
near-plugins = "0.5.2"
omni-utils = { git = "https://github.com/near-one/omni-utils", rev = "f9bc3ea4a72e97f02660b8f1c0b2f79a9fbde3a4" }

[profile.release]
codegen-units = 1
opt-level = "z"
lto = true
debug = false
panic = "abort"
overflow-checks = true
